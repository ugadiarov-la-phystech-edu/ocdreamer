optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 10000
    decay_steps: 100000
model:
  initializer:
    name: FixedLearnedInit
    n_slots: 9
    dim: 64
  encoder:
    backbone:
      name: TimmExtractor
      model: vit_base_patch14_dinov2
      features: vit_block12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: 768
      outp_dim: 64
      hidden_dim: 1536
      layer_norm: true
  grouper:
    name: SlotAttention
    inp_dim: 64
    slot_dim: 64
    n_iters: 3
    use_mlp: true
  decoder:
    name: MLPDecoder
    inp_dim: 64
    outp_dim: 768
    hidden_dims:
    - 1024
    - 1024
    - 1024
    n_patches: 256
  predictor: null
  target_encoder: null
  latent_processor: null
  mask_resizers: null
  losses: null
  loss_weights: null
  input_type: image
  target_type: features
  target_encoder_input: null
  visualize: true
  eval_mode_config: null
  visualize_every_n_steps: 10000
  visualize_segmentations: false
  masks_to_visualize: null
  load_weights: null
  modules_to_load: null
dataset:
  name: EpisodeDataModule
  input_size: 224
  batch_size: 128
  num_workers: 8
  extension: JPEG
  kind: image
  sequence_length: 1
  augmentation_probability: 0.5
wandb: null
comet:
  project: homegrid_dinosaur
  run_name: n-slots-9_slot-dim-64
  run_id: null
trainer:
  max_steps: 500000
  log_every_n_steps: 200
  val_check_interval: 2500
  gradient_clip_val: 1.0
  accelerator: auto
train_metrics: null
val_metrics: null
globals:
  INPUT_TYPE: image
  NUM_SLOTS: 9
  SLOT_DIM: 64
  VIT_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 256
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 128
  TOTAL_BATCH_SIZE: 128
  BASE_LR: 0.0002
experiment_name: homegrid_base14_dinov2
experiment_group: dinosaur
seed: 1006025094
checkpoint_every_n_steps: 1000
monitor: val/loss
